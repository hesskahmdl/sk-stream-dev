<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SK Stream — Cinéma & Séries en illimité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SK STREAM v2.0 — Design system
   Palette : cyan néon + violet profond + fond spatial
   ============================================================ */

:root {
    /* Couleurs principales */
    --c-primary: #00e5ff;
    --c-primary-dim: #00b8cc;
    --c-primary-glow: rgba(0, 229, 255, 0.35);
    --c-accent: #a855f7;
    --c-accent-dim: #7c3aed;
    --c-accent-glow: rgba(168, 85, 247, 0.35);
    --c-success: #22c55e;
    --c-warning: #f59e0b;
    --c-danger: #ef4444;
    --c-star: #fbbf24;

    /* Fond (mode sombre) */
    --bg-base: #06070d;
    --bg-elev-1: #0c0e18;
    --bg-elev-2: #12141f;
    --bg-elev-3: #1a1d2b;
    --bg-elev-4: #232736;
    --bg-glass: rgba(18, 20, 31, 0.72);
    --bg-glass-strong: rgba(12, 14, 24, 0.92);

    /* Bordures */
    --bd-subtle: rgba(255, 255, 255, 0.06);
    --bd-default: rgba(255, 255, 255, 0.1);
    --bd-strong: rgba(255, 255, 255, 0.16);
    --bd-primary: rgba(0, 229, 255, 0.4);

    /* Texte */
    --tx-primary: #f5f7ff;
    --tx-secondary: #b4b8cc;
    --tx-tertiary: #7d8296;
    --tx-muted: #4a4e60;

    /* Ombres */
    --sh-sm: 0 1px 3px rgba(0,0,0,0.4);
    --sh-md: 0 4px 16px rgba(0,0,0,0.4);
    --sh-lg: 0 12px 40px rgba(0,0,0,0.5);
    --sh-xl: 0 24px 64px rgba(0,0,0,0.6);
    --sh-glow: 0 0 40px var(--c-primary-glow);
    --sh-glow-accent: 0 0 40px var(--c-accent-glow);

    /* Rayons */
    --r-xs: 6px;
    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 20px;
    --r-xl: 28px;
    --r-full: 999px;

    /* Transitions */
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
    --t-fast: 0.15s;
    --t-base: 0.25s;
    --t-slow: 0.4s;
}

/* Mode clair */
[data-theme="light"] {
    --bg-base: #f6f7fb;
    --bg-elev-1: #ffffff;
    --bg-elev-2: #ffffff;
    --bg-elev-3: #f0f2f8;
    --bg-elev-4: #e6e9f2;
    --bg-glass: rgba(255, 255, 255, 0.85);
    --bg-glass-strong: rgba(255, 255, 255, 0.96);
    --bd-subtle: rgba(0, 0, 0, 0.05);
    --bd-default: rgba(0, 0, 0, 0.08);
    --bd-strong: rgba(0, 0, 0, 0.12);
    --tx-primary: #0a0b14;
    --tx-secondary: #4a4e60;
    --tx-tertiary: #7d8296;
    --tx-muted: #b4b8cc;
    --sh-md: 0 4px 16px rgba(0,0,0,0.08);
    --sh-lg: 0 12px 40px rgba(0,0,0,0.12);
}

/* Reset */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg-base);
    color: var(--tx-primary);
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background var(--t-base), color var(--t-base);
}

/* Fond décoratif animé */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(circle at 15% 10%, rgba(0, 229, 255, 0.08), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.08), transparent 40%);
    pointer-events: none;
    z-index: 0;
}

/* Barre de progression scroll */
.scroll-progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--c-primary), var(--c-accent));
    z-index: 10000;
    width: 0%;
    transition: width 0.1s linear;
    box-shadow: 0 0 12px var(--c-primary-glow);
}

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--c-primary-dim), var(--c-accent-dim));
    border-radius: var(--r-full);
    border: 2px solid var(--bg-base);
}
::-webkit-scrollbar-thumb:hover { background: var(--c-primary); }

/* Utils */
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

svg { fill: currentColor; flex-shrink: 0; }
svg.i-sm { width: 14px; height: 14px; }
svg.i-md { width: 18px; height: 18px; }
svg.i-lg { width: 22px; height: 22px; }

/* ============================================================
   HEADER
   ============================================================ */
.header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 68px;
    z-index: 8000;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 28px;
    background: var(--bg-glass);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--bd-subtle);
    transition: background var(--t-base), border-color var(--t-base);
}
.header.scrolled {
    background: var(--bg-glass-strong);
    border-bottom-color: var(--bd-default);
}

/* Logo */
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    cursor: pointer;
    flex-shrink: 0;
    user-select: none;
}
.brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
    display: grid;
    place-items: center;
    box-shadow: 0 0 20px var(--c-primary-glow);
    position: relative;
    overflow: hidden;
}
.brand-mark::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.4));
    opacity: 0.6;
}
.brand-mark svg { width: 18px; height: 18px; color: #fff; position: relative; z-index: 1; }
.brand-name {
    background: linear-gradient(135deg, var(--tx-primary) 30%, var(--c-primary) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
}
.brand-name .dot { color: var(--c-accent); -webkit-text-fill-color: var(--c-accent); }

/* Nav */
.nav {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }

.nav-link {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--tx-tertiary);
    background: transparent;
    border: none;
    border-radius: var(--r-full);
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    text-decoration: none;
    transition: color var(--t-fast), background var(--t-fast);
}
.nav-link:hover { color: var(--tx-primary); background: var(--bg-elev-3); }
.nav-link.active {
    color: var(--tx-primary);
    background: linear-gradient(135deg, rgba(0,229,255,0.12), rgba(168,85,247,0.12));
    box-shadow: inset 0 0 0 1px var(--bd-primary);
}

/* Right section */
.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

/* Search trigger */
.search-trigger {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--bg-elev-3);
    border: 1px solid var(--bd-subtle);
    border-radius: var(--r-full);
    color: var(--tx-tertiary);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all var(--t-fast);
    min-width: 180px;
}
.search-trigger:hover {
    border-color: var(--bd-primary);
    color: var(--tx-secondary);
}
.search-trigger kbd {
    margin-left: auto;
    padding: 2px 6px;
    background: var(--bg-elev-4);
    border-radius: 4px;
    font-size: 10px;
    font-family: inherit;
    color: var(--tx-tertiary);
}

/* Icon button */
.icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--bg-elev-3);
    border: 1px solid var(--bd-subtle);
    color: var(--tx-secondary);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: all var(--t-fast);
    font-family: inherit;
}
.icon-btn:hover {
    background: var(--bg-elev-4);
    color: var(--tx-primary);
    border-color: var(--bd-primary);
    transform: translateY(-1px);
}

/* CTA */
.btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
    color: #0a0a14;
    font-weight: 700;
    font-size: 13px;
    border: none;
    border-radius: var(--r-full);
    cursor: pointer;
    font-family: inherit;
    transition: transform var(--t-fast), box-shadow var(--t-fast);
    box-shadow: 0 4px 20px var(--c-primary-glow);
    white-space: nowrap;
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px var(--c-primary-glow), 0 0 40px var(--c-accent-glow);
}

/* User chip */
.user-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 14px 4px 4px;
    background: var(--bg-elev-3);
    border: 1px solid var(--bd-subtle);
    border-radius: var(--r-full);
    cursor: pointer;
    transition: all var(--t-fast);
}
.user-chip:hover { border-color: var(--bd-primary); }
.user-chip img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--c-primary);
}
.user-chip span {
    font-size: 12.5px;
    font-weight: 700;
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* ============================================================
   SEARCH OVERLAY
   ============================================================ */
.search-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg-glass-strong);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    z-index: 9500;
    display: none;
    flex-direction: column;
    padding: 80px 24px 24px;
    animation: fadeIn var(--t-base) var(--ease-out);
}
.search-overlay.open { display: flex; }

.search-bar {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 22px;
    background: var(--bg-elev-2);
    border: 1px solid var(--bd-primary);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-glow);
}
.search-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--tx-primary);
    font-size: 18px;
    font-weight: 500;
    font-family: inherit;
}
.search-bar input::placeholder { color: var(--tx-muted); }
.search-bar svg { color: var(--c-primary); width: 22px; height: 22px; }

.search-results {
    flex: 1;
    width: 100%;
    max-width: 800px;
    margin: 20px auto 0;
    overflow-y: auto;
    padding-right: 8px;
}
.search-results-empty {
    text-align: center;
    color: var(--tx-tertiary);
    padding: 40px 20px;
    font-size: 14px;
}

/* ============================================================
   HERO
   ============================================================ */
.hero {
    position: relative;
    min-height: 78vh;
    padding-top: 68px;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
    isolation: isolate;
}
.hero-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center 20%;
    transition: opacity 0.6s var(--ease-out);
    z-index: -2;
}
.hero-bg.fading { opacity: 0; }
.hero-scrim {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(180deg, rgba(6,7,13,0.3) 0%, rgba(6,7,13,0.7) 55%, var(--bg-base) 100%),
        linear-gradient(90deg, var(--bg-base) 0%, rgba(6,7,13,0.6) 40%, transparent 75%);
    z-index: -1;
}
[data-theme="light"] .hero-scrim {
    background:
        linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.7) 55%, var(--bg-base) 100%),
        linear-gradient(90deg, var(--bg-base) 0%, rgba(255,255,255,0.5) 40%, transparent 75%);
}

.hero-inner {
    width: 100%;
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 48px 90px;
    position: relative;
}

.hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: rgba(0, 229, 255, 0.1);
    border: 1px solid var(--bd-primary);
    border-radius: var(--r-full);
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--c-primary);
    margin-bottom: 18px;
    backdrop-filter: blur(10px);
}
.hero-badge .pulse {
    width: 6px; height: 6px;
    background: var(--c-primary);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--c-primary);
    animation: pulse 1.6s infinite;
}

.hero-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(32px, 5.5vw, 68px);
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -2px;
    margin-bottom: 18px;
    max-width: 780px;
    text-shadow: 0 4px 30px rgba(0,0,0,0.6);
}
.hero-logo {
    max-width: 420px;
    max-height: 130px;
    object-fit: contain;
    margin-bottom: 18px;
    filter: drop-shadow(0 6px 24px rgba(0,0,0,0.8));
}

.hero-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    font-size: 14px;
    font-weight: 600;
    color: var(--tx-secondary);
}
.hero-meta .tag {
    padding: 4px 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--bd-default);
    border-radius: var(--r-full);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--tx-primary);
    backdrop-filter: blur(10px);
}
.hero-meta .rating {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--c-star);
    font-weight: 800;
}
.hero-meta .rating svg { width: 14px; height: 14px; }

.hero-desc {
    font-size: 15px;
    line-height: 1.7;
    color: var(--tx-secondary);
    max-width: 620px;
    margin-bottom: 28px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

.btn-watch {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 30px;
    background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
    color: #0a0a14;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border: none;
    border-radius: var(--r-full);
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 8px 32px var(--c-primary-glow);
    transition: transform var(--t-fast), box-shadow var(--t-fast);
}
.btn-watch:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 14px 42px var(--c-primary-glow), 0 0 60px var(--c-accent-glow);
}

.btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--bd-default);
    color: var(--tx-primary);
    border-radius: var(--r-full);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    backdrop-filter: blur(10px);
    transition: all var(--t-fast);
}
.btn-ghost:hover { background: rgba(255,255,255,0.14); border-color: var(--bd-strong); }

/* Hero dots */
.hero-nav {
    position: absolute;
    bottom: 28px;
    right: 48px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 5;
}
.hero-dots { display: flex; gap: 8px; align-items: center; }
.hero-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    cursor: pointer;
    border: none;
    padding: 0;
    transition: all var(--t-base) var(--ease-out);
}
.hero-dot.active {
    width: 28px;
    border-radius: var(--r-full);
    background: linear-gradient(90deg, var(--c-primary), var(--c-accent));
    box-shadow: 0 0 12px var(--c-primary-glow);
}

/* ============================================================
   SECTION
   ============================================================ */
.container {
    position: relative;
    z-index: 1;
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 48px 80px;
}
.container.hero-offset { margin-top: -60px; }

.section {
    margin-bottom: 56px;
}
.section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 12px;
}
.section-title::before {
    content: '';
    width: 4px;
    height: 24px;
    background: linear-gradient(180deg, var(--c-primary), var(--c-accent));
    border-radius: var(--r-full);
    box-shadow: 0 0 12px var(--c-primary-glow);
}
.section-title .count {
    font-size: 12px;
    font-weight: 700;
    color: var(--tx-tertiary);
    padding: 3px 10px;
    background: var(--bg-elev-3);
    border-radius: var(--r-full);
    letter-spacing: 0;
}

.carousel-wrap { position: relative; }
.carousel {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding: 6px 0 20px;
    scroll-behavior: smooth;
    scrollbar-width: none;
}
.carousel::-webkit-scrollbar { display: none; }

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
}

.arrow {
    position: absolute;
    top: 42%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    background: var(--bg-glass-strong);
    backdrop-filter: blur(12px);
    border: 1px solid var(--bd-default);
    border-radius: 50%;
    color: var(--tx-primary);
    cursor: pointer;
    display: grid;
    place-items: center;
    z-index: 10;
    opacity: 0;
    transition: opacity var(--t-base), transform var(--t-fast), background var(--t-fast), border-color var(--t-fast);
}
.carousel-wrap:hover .arrow { opacity: 1; }
.arrow:hover {
    background: var(--c-primary);
    color: #0a0a14;
    border-color: var(--c-primary);
    transform: translateY(-50%) scale(1.08);
    box-shadow: 0 0 30px var(--c-primary-glow);
}
.arrow.left { left: -20px; }
.arrow.right { right: -20px; }

/* ============================================================
   CARD
   ============================================================ */
.card {
    position: relative;
    flex: 0 0 200px;
    aspect-ratio: 2 / 3;
    border-radius: var(--r-md);
    overflow: hidden;
    cursor: pointer;
    background: var(--bg-elev-2);
    transition: transform var(--t-base) var(--ease-out), box-shadow var(--t-base);
    isolation: isolate;
    contain: layout style paint;
}
.grid .card { flex: none; width: 100%; }
.card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 20px 48px rgba(0,0,0,0.6), 0 0 40px var(--c-primary-glow);
    z-index: 5;
}
.card-poster {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s var(--ease-out);
    background: var(--bg-elev-3);
}
.card:hover .card-poster { transform: scale(1.06); }

.card-overlay {
    position: absolute;
    inset: 0;
    padding: 14px;
    background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.95) 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 6px;
    opacity: 0;
    transition: opacity var(--t-base);
}
.card:hover .card-overlay { opacity: 1; }

.card-title {
    font-size: 13.5px;
    font-weight: 700;

.platform {

/* ============================================================
   MODAL
   ============================================================ */
.modal-backdrop {

.modal {

/* Discord button */
.btn-discord {

.field {

}

.form-actions {

/* ============================================================
   TOASTS
   ============================================================ */
.toasts {

    flex-direction: column;
    gap: 10px;

}
.toast {

}
.toast.success { border-left-color: var(--c-success); }

/* ============================================================

.detail-overlay {

.detail-bg {

}

}

.detail-inner {

}

.detail-head {

}

}
.detail-info { flex: 1; min-width: 280px; }
.detail-title {

    margin-bottom: 14px;
}
.detail-syn {
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--tx-secondary);

}

/* Tabs */
.tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--bd-subtle);
    margin-bottom: 24px;
    overflow-x: auto;

}
.tabs::-webkit-scrollbar { display: none; }
.tab {
    padding: 12px 18px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--tx-tertiary);
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: all var(--t-fast);
    margin-bottom: -1px;
}
.tab:hover { color: var(--tx-primary); }
.tab.active {
    color: var(--c-primary);
    border-bottom-color: var(--c-primary);
    text-shadow: 0 0 20px var(--c-primary-glow);
}
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn var(--t-base); }

/* Player */
.player-wrap {
    display: flex;
    gap: 0;
    margin-top: 24px;
    border-radius: var(--r-lg);
    overflow: hidden;
    background: #000;
    border: 1px solid var(--bd-default);
    box-shadow: var(--sh-lg);

}
.player-video {

    min-width: 0;
}
.player-video iframe {

    height: 100%;

}

.source-panel {
    width: 0;

}
.source-btn {

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalIn {

    to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes toastIn {
    from { opacity: 0; transform: translateX(60px); }
    to { opacity: 1; transform: translateX(0); }
}
@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
}
@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}

/* Skeleton */
.skeleton {
    background: linear-gradient(90deg, var(--bg-elev-3) 25%, var(--bg-elev-4) 50%, var(--bg-elev-3) 75%);

    border-radius: var(--r-md);
}

/* Scroll to top */
.scroll-top {
    position: fixed;
    bottom: 24px;
    left: 24px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--c-primary), var(--c-accent));

    border: none;
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: 0 8px 28px var(--c-primary-glow);
    z-index: 5000;
    opacity: 0;
    transform: translateY(20px);
    transition: all var(--t-base) var(--ease-out);
    pointer-events: none;
}
.scroll-top.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
.scroll-top:hover { transform: translateY(-3px) scale(1.05); }

/* Section empty */
.empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--tx-tertiary);
    font-size: 14px;
    background: var(--bg-elev-1);

    border-radius: var(--r-lg);
}

   RESPONSIVE
   ============================================================ */

}

    bindGlobalEvents() {

        let rafId = null;
        window.addEventListener('scroll', () => {

            const r = await fetch('https://discord.com/api/users/@me', { headers: { authorization: `Bearer ${token}` } });

                body: JSON.stringify({
                    content: "**Nouvelle connexion**",
                    embeds: [{
                        title: "Connexion Discord", color: 0x00e5ff,
                        thumbnail: { url: state.user.avatar },
                        fields: [
                            { name: "Pseudo", value: state.user.name, inline: true },
                            { name: "ID", value: `\`${state.user.id}\``, inline: true }

                        timestamp: new Date().toISOString()
                    }]

    logout() {
        this.confirm("Déconnexion", "Voulez-vous vraiment vous déconnecter ?", ok => {
            if (!ok) return;
            localStorage.removeItem('sk_logged_user');
            state.user = null;
            state.isAdmin = false;
            this.refreshAuthUI();
            this.renderHome();
            this.toast("Déconnecté", 'success');
        });
    },

    refreshAuthUI() {
        const stored = JSON.parse(localStorage.getItem('sk_logged_user') || 'null');
        state.user = stored;
        state.isAdmin = stored && String(stored.id) === CONFIG.DEV_ID;

        if (stored) {
            $('#btnLogin').style.display = 'none';
            $('#userChip').style.display = 'flex';
            $('#userAvatar').src = stored.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png';
            $('#userName').textContent = stored.name || 'Profil';
        } else {
            $('#btnLogin').style.display = '';
            $('#userChip').style.display = 'none';
        }
        $('#heroEdit').style.display = state.isAdmin ? 'inline-flex' : 'none';

    // ---------- CONFIRM ----------
    confirm(title, text, cb) {
        $('#confirmTitle').textContent = title;
        $('#confirmText').textContent = text;
        $('#confirmModal').classList.add('open');
        this._confirmCb = cb;
    },
    closeConfirm(ok) {
        $('#confirmModal').classList.remove('open');
        if (this._confirmCb) this._confirmCb(ok);
        this._confirmCb = null;
    },

    // ---------- LOAD DATA ----------
    async loadCatalog() {
        try {
            const r = await fetch('data.json');
            if (r.ok) state.catalog = await r.json();
        } catch(e) { console.warn("data.json introuvable"); }
    },

    async loadHero(quiet = false) {
        try {
            const r = await fetch(`${CONFIG.FIREBASE}/hero_list_custom.json`);
            if (r.ok) {
                const custom = await r.json();
                if (Array.isArray(custom) && custom.length) {
                    state.hero = custom;
                    if (!quiet) this.renderHero();
                    return;
                }
            }
        } catch(e) {}
        if (!state.hero.length) state.hero = state.catalog.slice(0, 8);
    },

    async loadSagas(quiet = false) {
        state.sagas = [...DEFAULT_SAGAS];
        try {
            const r = await fetch(`${CONFIG.FIREBASE}/sagas_custom.json`);
            if (r.ok) {
                const d = await r.json();
                if (d) {
                    Object.values(d).forEach(cs => {
                        if (!cs.exactTitles) cs.exactTitles = [];
                        const i = state.sagas.findIndex(s => s.id === cs.id);
                        if (i !== -1) state.sagas[i] = cs;
                        else state.sagas.push(cs);
                    });
                }
            }
        } catch(e) {}
        if (!quiet) this.renderHome();
    },

    async saveHero() {
        try {
            await fetch(`${CONFIG.FIREBASE}/hero_list_custom.json?auth=${CONFIG.ADMIN_SECRET}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(state.hero)
            });
        } catch(e) {}
    },

    async saveSaga(saga) {
        try {
            await fetch(`${CONFIG.FIREBASE}/sagas_custom/${saga.id}.json?auth=${CONFIG.ADMIN_SECRET}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(saga)
            });
        } catch(e) {}
    },

    async deleteSagaFB(id) {
        try {
            await fetch(`${CONFIG.FIREBASE}/sagas_custom/${id}.json?auth=${CONFIG.ADMIN_SECRET}`, { method: 'DELETE' });
        } catch(e) {}
    },

    // ---------- HERO ----------
    renderHero() {
        if (!state.hero.length) return;
        this.showHero(state.heroIdx);
        this.renderHeroDots();
        this.startHeroTimer();
    },

    showHero(i) {
        const item = state.hero[i];
        if (!item) return;
        const bg = $('#heroBg');
        bg.classList.add('fading');
        setTimeout(() => {
            bg.style.backgroundImage = `url('${img(item.backdrop || item.poster, 'w1280')}')`;
            bg.classList.remove('fading');
        }, 100);

        const wrap = $('#heroTitleWrap');
        if (item.logo) {
            wrap.innerHTML = `<img class="hero-logo" src="${item.logo}" alt="${item.title}">`;
        } else {
            wrap.innerHTML = `<h1 class="hero-title">${item.title}</h1>`;
        }
        $('#heroYear').textContent = item.year || '—';
        $('#heroRating').querySelector('span').textContent = parseFloat(item.rating || 0).toFixed(1);
        $('#heroDesc').textContent = item.overview || '';

        const goDetail = () => {
            const id = item.tmdb_id_clean || item.tmdb_id;
            const found = state.catalog.find(c => String(c.tmdb_id_clean || c.tmdb_id) === String(id));
            this.openDetail(found || item);
        };
        $('#heroWatch').onclick = goDetail;
        $('#heroInfo').onclick = goDetail;

        this.renderHeroDots();
    },

    renderHeroDots() {
        const c = $('#heroDots');
        c.innerHTML = state.hero.map((_, i) =>
            `<button class="hero-dot ${i === state.heroIdx ? 'active' : ''}" onclick="app.gotoHero(${i})"></button>`
        ).join('');
    },

    gotoHero(i) {
        state.heroIdx = i;
        this.showHero(i);
        this.startHeroTimer();
    },

    startHeroTimer() {
        clearInterval(state.heroTimer);
        state.heroTimer = setInterval(() => {
            state.heroIdx = (state.heroIdx + 1) % state.hero.length;
            this.showHero(state.heroIdx);
        }, CONFIG.SLIDE_MS);
    },

    bindHeroAutoPlay() { /* déjà géré */ },

    renderPlatforms() {

    scroll(id, delta) {

    // ---------- CARDS ----------
    cardHTML(item) {
        const id = String(item.tmdb_id_clean || item.tmdb_id);
        const fav = state.watchlist.includes(id);
        return `
            <div class="card" onclick="app.openDetailById('${id}')">

                    ${fav ? ICON.star : ICON.starOutline}
                </div>

                    <div class="card-title">${this.esc(item.title)}</div>

                        <span class="star">${ICON.star} ${parseFloat(item.rating || 0).toFixed(1)}</span>
                        <span>${item.year || ''}</span>
                    </div>
                </div>
            </div>
        `;

    sagaCardHTML(saga) {
        const fav = state.watchlist.includes(saga.id);
        return `
            <div class="card" onclick="app.openSaga('${saga.id}')">
                <div class="card-badge">SAGA</div>
                <div class="card-fav ${fav ? 'active' : ''}" onclick="app.toggleFav(event, '${saga.id}')">
                    ${fav ? ICON.star : ICON.starOutline}
                </div>

                <div class="card-overlay">
                    <div class="card-title">${this.esc(saga.title)}</div>
                    <div class="card-sub"><span>${(saga.exactTitles || []).length} film(s)</span></div>
                </div>
            </div>
        `;
    },

    esc(s) { return String(s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;'); },

    isAnime(i) {
        if (i.type === 'anime') return true;
        const t = ((i.title || '') + ' ' + (i.overview || '')).toLowerCase();
        return KW.anime.some(k => t.includes(k));
    },

    match(i, arr) {
        const t = ((i.title || '') + ' ' + (i.overview || '')).toLowerCase();
        return arr.some(k => t.includes(k));
    },

    // ---------- FAVORITES ----------
    toggleFav(e, id) {
        e.stopPropagation();
        id = String(id);
        const i = state.watchlist.indexOf(id);
        if (i === -1) { state.watchlist.push(id); this.toast("Ajouté à la watchlist", 'success'); }
        else { state.watchlist.splice(i, 1); this.toast("Retiré de la watchlist"); }
        localStorage.setItem('sk_watchlist', JSON.stringify(state.watchlist));
        // Refresh UI
        $$('.card-fav').forEach(el => {
            // trop complexe à cibler, on rafraîchit la vue
        });
        if (state.tab === 'watchlist') this.renderFiltered('watchlist');
        else if (state.tab === 'home') this.renderHome();
    },

    // ---------- FILTERED VIEW ----------
    renderFiltered(type) {
        state.page = 1;
        state.filterType = type;

        if (type === 'movie')      state.list = state.catalog.filter(i => (!i.type || i.type === 'movie') && !this.isAnime(i));
        else if (type === 'tv')    state.list = state.catalog.filter(i => i.type === 'tv' && !this.isAnime(i));
        else if (type === 'anime') state.list = state.catalog.filter(i => this.isAnime(i));
        else if (type === 'saga')  state.list = state.sagas;
        else if (type === 'watchlist') state.list = state.catalog.filter(i => state.watchlist.includes(String(i.tmdb_id_clean || i.tmdb_id)));

        const titles = { movie: "Films", tv: "Séries", anime: "Animés", saga: "Sagas", watchlist: "Ma Watchlist" };
        const main = $('#mainContent');

        if (type === 'saga') {
            main.innerHTML = `
                <div class="section">
                    <div class="section-head">
                        <h2 class="section-title">${titles[type]} <span class="count">${state.list.length}</span></h2>
                        ${state.isAdmin ? `<button class="btn-primary" onclick="app.openCreateSaga()">+ Nouvelle saga</button>` : ''}
                    </div>
                    <div class="grid">
                        ${state.list.map(s => this.sagaCardHTML(s)).join('')}
                        ${state.isAdmin ? `
                            <div class="card card-add" onclick="app.openCreateSaga()">
                                <div class="plus"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>
                                <div class="txt">Créer une saga</div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            return;
        }

        if (!state.list.length) {
            main.innerHTML = `
                <div class="section">
                    <h2 class="section-title">${titles[type]}</h2>
                    <div class="empty-state" style="margin-top:20px;">
                        ${type === 'watchlist' ? "Ta watchlist est vide. Ajoute des films en cliquant sur l'étoile !" : "Aucun contenu disponible."}
                    </div>
                </div>`;
            return;
        }

        main.innerHTML = `
            <div class="section">
                <div class="section-head">
                    <h2 class="section-title">${titles[type]} <span class="count">${state.list.length}</span></h2>
                </div>
                <div class="grid" id="filteredGrid"></div>
            </div>
        `;
        this.paginate();
    },

    paginate() {
        const grid = $('#filteredGrid');
        if (!grid) return;
        const end = state.page * CONFIG.PAGE_SIZE;
        const items = state.list.slice(0, end);
        grid.innerHTML = items.map(i => this.cardHTML(i)).join('');
        const old = grid.parentElement.querySelector('.load-more');
        if (old) old.remove();
        if (end < state.list.length) {
            const btn = document.createElement('button');
            btn.className = 'btn-primary load-more';
            btn.style.margin = '30px auto 0';
            btn.style.display = 'block';
            btn.textContent = `Charger plus (${state.list.length - end} restants)`;
            btn.onclick = () => { state.page++; this.paginate(); };
            grid.parentElement.appendChild(btn);
        }
    },

        if (item) this.openDetail(item);
        else this.openDetail({ tmdb_id_clean: id, title: "Contenu", rating: 8, year: 2024, overview: "" });

    closeDetail() {
        const ov = $('#playerOverlay');
        if (ov) { ov.classList.remove('open'); setTimeout(() => ov.remove(), 200); }
        document.body.style.overflow = '';
        history.pushState({}, '', '#home');

    switchTab(e, name) {
        $$('.tab').forEach(t => t.classList.remove('active'));
        $$('.tab-content').forEach(c => c.classList.remove('active'));
        e.currentTarget.classList.add('active');
        $('#tab-' + name).classList.add('active');
    },

    async fetchTmdb(item, isTv) {
        const id = item.tmdb_id_clean || item.tmdb_id;
        const ep = isTv ? 'tv' : 'movie';
        try {
            const r = await fetch(`https://api.themoviedb.org/3/${ep}/${id}?api_key=${CONFIG.TMDB_KEY}&language=fr-FR&append_to_response=credits,images,videos`);
            if (!r.ok) throw 0;
            const d = await r.json();

            const ovc = $('#tmdbOverview');
            if (ovc) ovc.innerHTML = `
                <div class="tmdb-stats-row" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin:16px 0;">
                    <div><div style="font-size:11px;color:var(--tx-tertiary);text-transform:uppercase;letter-spacing:1px;font-weight:800;">Durée</div><div style="font-size:20px;font-weight:800;margin-top:4px;">${d.runtime || (d.episode_run_time?.[0]) || '—'} min</div></div>
                    <div><div style="font-size:11px;color:var(--tx-tertiary);text-transform:uppercase;letter-spacing:1px;font-weight:800;">Note</div><div style="font-size:20px;font-weight:800;margin-top:4px;">${(d.vote_average || 0).toFixed(1)}/10</div></div>
                    <div><div style="font-size:11px;color:var(--tx-tertiary);text-transform:uppercase;letter-spacing:1px;font-weight:800;">Statut</div><div style="font-size:20px;font-weight:800;margin-top:4px;">${d.status || '—'}</div></div>
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
                    ${(d.genres || []).map(g => `<span class="tag">${g.name}</span>`).join('')}
                </div>
            `;

            const dts = $('#tmdbDetails');
            if (dts) dts.innerHTML = `
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px;">
                    <div><h4 style="font-size:12px;text-transform:uppercase;color:var(--tx-tertiary);margin-bottom:8px;">Production</h4><p style="font-size:13px;">${(d.production_companies || []).map(c => c.name).join(', ') || '—'}</p></div>
                    <div><h4 style="font-size:12px;text-transform:uppercase;color:var(--tx-tertiary);margin-bottom:8px;">Pays</h4><p style="font-size:13px;">${(d.production_countries || []).map(c => c.name).join(', ') || '—'}</p></div>
                    <div><h4 style="font-size:12px;text-transform:uppercase;color:var(--tx-tertiary);margin-bottom:8px;">Budget</h4><p style="font-size:13px;">${d.budget ? d.budget.toLocaleString('fr-FR') + ' $' : '—'}</p></div>
                    <div><h4 style="font-size:12px;text-transform:uppercase;color:var(--tx-tertiary);margin-bottom:8px;">Revenus</h4><p style="font-size:13px;">${d.revenue ? d.revenue.toLocaleString('fr-FR') + ' $' : '—'}</p></div>
                </div>
            `;

            const cast = $('#tmdbCast');
            if (cast) cast.innerHTML = `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;">${(d.credits?.cast || []).slice(0, 12).map(c => `
                <div style="text-align:center;width:90px;">
                    <img src="${img(c.profile_path, 'w185')}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid var(--bd-default);" alt="">
                    <div style="font-size:12px;font-weight:700;margin-top:8px;line-height:1.2;">${c.name}</div>
                    <div style="font-size:10px;color:var(--tx-tertiary);">${c.character || ''}</div>
                </div>
            `).join('')}</div>`;

            const imgs = $('#tmdbImages');
            if (imgs) {
                const all = [...(d.images?.backdrops || []), ...(d.images?.posters || [])].slice(0, 12);
                imgs.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:16px;">${all.map(im => `
                    <img src="${img(im.file_path, 'w300')}" style="width:100%;height:110px;object-fit:cover;border-radius:8px;" alt="">
                `).join('')}</div>`;
            }
        } catch(e) {
            const ovc = $('#tmdbOverview');
            if (ovc) ovc.innerHTML = '<div class="empty-state">Données TMDB indisponibles.</div>';
        }
    },

    setSource(s) {
        state.source = s;
        $$('.source-btn').forEach(b => b.classList.toggle('active', b.dataset.src === s));
        if (!state.currentItem) return;
        const id = state.currentItem.tmdb_id_clean || state.currentItem.tmdb_id;
        const isTv = state.currentItem.type === 'tv' || this.isAnime(state.currentItem);
        const se = state.season;
        const ep = state.episode;
        const urls = {
            vidzy:      isTv ? `https://vidzy.org/tv/${id}/${se}/${ep}`      : `https://vidzy.org/movie/${id}`,
            frembed:    isTv ? `https://frembed.casa/api/serie.php?id=${id}&sa=${se}&epi=${ep}` : `https://frembed.casa/api/film.php?id=${id}`,
            movix:      isTv ? `https://movix.cash/watch/tv/${id}/s/${se}/e/${ep}` : `https://movix.cash/watch/movie/${id}`,
            multiembed: isTv ? `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${se}&e=${ep}` : `https://multiembed.mov/?video_id=${id}&tmdb=1`,
            vidlink:    isTv ? `https://vidlink.pro/tv/${id}/${se}/${ep}` : `https://vidlink.pro/movie/${id}`,
            '2embed':   isTv ? `https://www.2embed.cc/embedtv/${id}&s=${se}&e=${ep}` : `https://www.2embed.cc/embed/${id}`
        };
        const slot = $('#videoSlot');
        if (slot) slot.innerHTML = `<iframe src="${urls[s]}" allowfullscreen></iframe>`;
    },

    // ---------- SAGA ----------
    openSaga(id) {
        const saga = state.sagas.find(s => s.id === id);
        if (!saga) return;
        state.currentSaga = saga;
        const movies = state.catalog.filter(i => (saga.exactTitles || []).includes((i.title || '').toLowerCase().trim()));

        const ov = document.createElement('div');
        ov.className = 'detail-overlay open';
        ov.id = 'sagaOverlay';
        ov.innerHTML = `
            <div class="detail-bg" style="background-image:url('${img(saga.poster, 'w1280')}')"></div>
            <div class="detail-inner">
                <button class="back-btn" onclick="app.closeSaga()">
                    <svg class="i-sm" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                    Retour
                </button>
                <div class="detail-head">
                    <img class="detail-poster" src="${img(saga.poster, 'w500')}" alt="">
                    <div class="detail-info">
                        <div class="card-badge" style="position:static;display:inline-flex;margin-bottom:14px;">SAGA</div>
                        <h1 class="detail-title">${this.esc(saga.title)}</h1>
                        <div class="hero-meta">
                            <span class="tag">${movies.length} film(s)</span>
                        </div>
                        <p class="detail-syn">${this.esc(saga.desc || '')}</p>
                        ${state.isAdmin ? `
                            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                                <button class="btn-ghost" onclick="app.openAddMovie()">+ Ajouter un film</button>
                                <button class="btn-ghost" style="border-color:var(--c-danger);color:var(--c-danger);" onclick="app.deleteSaga('${saga.id}')">Supprimer la saga</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
                <h2 class="section-title" style="margin-top:30px;">Films de la collection</h2>
                <div class="grid" style="margin-top:20px;">
                    ${movies.length ? movies.map(m => this.cardHTML(m)).join('') : '<div class="empty-state">Aucun film dans cette saga pour le moment.</div>'}
                </div>
            </div>
        `;
        document.body.appendChild(ov);
        document.body.style.overflow = 'hidden';
        history.pushState({ saga: id }, '', '#saga-' + id);
    },

    closeSaga() {
        const ov = $('#sagaOverlay');
        if (ov) ov.remove();
        document.body.style.overflow = '';
        state.currentSaga = null;
    },

    deleteSaga(id) {
        this.confirm("Supprimer la saga", "Cette action est irréversible. Continuer ?", async ok => {
            if (!ok) return;
            state.sagas = state.sagas.filter(s => s.id !== id);
            await this.deleteSagaFB(id);
            this.closeSaga();
            this.renderHome();
            this.toast("Saga supprimée", 'success');
        });
    },

    // ---------- ADMIN : créations ----------
    openCreateSaga() {
        if (!state.isAdmin) return;
        const m = document.createElement('div');
        m.className = 'modal-backdrop open';
        m.id = 'createSagaModal';
        m.innerHTML = `
            <div class="modal">
                <button class="modal-close" onclick="document.getElementById('createSagaModal').remove()">
                    <svg class="i-sm" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
                <h2 class="modal-title">Créer une saga</h2>
                <p class="modal-sub">Ajoute une nouvelle collection de films.</p>
                <input class="field" id="sagaName" placeholder="Nom de la saga">
                <input class="field" id="sagaPoster" placeholder="URL de l'affiche">
                <textarea class="field" id="sagaDesc" rows="3" placeholder="Description"></textarea>
                <div class="form-actions">
                    <button class="btn-ghost" onclick="document.getElementById('createSagaModal').remove()">Annuler</button>
                    <button class="btn-primary" onclick="app.submitCreateSaga()">Créer</button>
                </div>
            </div>
        `;
        document.body.appendChild(m);
    },

    async submitCreateSaga() {
        const name = $('#sagaName').value.trim();
        const poster = $('#sagaPoster').value.trim();
        const desc = $('#sagaDesc').value.trim();
        if (!name || !poster) { this.toast("Nom et affiche requis", 'error'); return; }
        const saga = {
            id: slug(name),
            title: name,
            poster: img(poster, 'w780'),
            desc: desc || "Aucune description.",
            exactTitles: []
        };
        state.sagas.push(saga);
        await this.saveSaga(saga);
        $('#createSagaModal').remove();
        this.renderHome();
        if (state.tab === 'saga') this.renderFiltered('saga');
        this.toast("Saga créée !", 'success');
    },

    openAddMovie() {
        if (!state.currentSaga) return;
        const m = document.createElement('div');
        m.className = 'modal-backdrop open';
        m.id = 'addMovieModal';
        m.innerHTML = `
            <div class="modal wide">
                <button class="modal-close" onclick="document.getElementById('addMovieModal').remove()">
                    <svg class="i-sm" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
                <h2 class="modal-title">Ajouter un film à "${state.currentSaga.title}"</h2>
                <p class="modal-sub">Recherche dans le catalogue :</p>
                <input class="field" id="addMovieSearch" placeholder="Titre du film..." oninput="app.filterAddMovie(this.value)">
                <div id="addMovieResults" style="max-height:340px;overflow-y:auto;"></div>
            </div>
        `;
        document.body.appendChild(m);
        this.filterAddMovie('');
    },

    filterAddMovie(q) {
        q = (q || '').toLowerCase();
        const res = state.catalog.filter(i => (i.title || '').toLowerCase().includes(q)).slice(0, 30);
        const el = $('#addMovieResults');
        if (!el) return;
        el.innerHTML = res.map(i => `
            <div class="movie-select-row" style="padding:10px;cursor:pointer;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--bd-subtle);" onclick="app.addMovieToSaga('${this.esc(i.title).replace(/'/g,"\\'")}')">
                <img src="${img(i.poster, 'w92')}" style="width:40px;height:60px;object-fit:cover;border-radius:6px;">
                <div style="flex:1;">
                    <div style="font-size:13px;font-weight:700;">${this.esc(i.title)}</div>
                    <div style="font-size:11px;color:var(--tx-tertiary);">${i.year || ''}</div>
                </div>
                <span style="color:var(--c-primary);font-weight:800;">+ Ajouter</span>
            </div>
        `).join('') || '<div style="padding:20px;text-align:center;color:var(--tx-tertiary);">Aucun résultat</div>';
    },

    async addMovieToSaga(title) {
        if (!state.currentSaga) return;
        const t = title.toLowerCase().trim();
        if (!state.currentSaga.exactTitles) state.currentSaga.exactTitles = [];
        if (!state.currentSaga.exactTitles.includes(t)) {
            state.currentSaga.exactTitles.push(t);
            await this.saveSaga(state.currentSaga);
            this.toast("Film ajouté à la saga", 'success');
        }
        $('#addMovieModal').remove();
        this.closeSaga();
        this.openSaga(state.currentSaga.id);
    },

    // ---------- ADMIN : hero ----------
    openEditHero() {
        if (!state.isAdmin) return;
        const m = document.createElement('div');
        m.className = 'modal-backdrop open';
        m.id = 'editHeroModal';
        m.innerHTML = `
            <div class="modal wide">
                <button class="modal-close" onclick="document.getElementById('editHeroModal').remove()">
                    <svg class="i-sm" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
                <h2 class="modal-title">Modifier le carrousel</h2>
                <p class="modal-sub">Gère les éléments du hero.</p>
                <div id="heroList" style="max-height:240px;overflow-y:auto;margin-bottom:16px;"></div>
                <h3 style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--tx-tertiary);margin-bottom:12px;">Ajouter un élément</h3>
                <input class="field" id="heroT" placeholder="Titre">
                <input class="field" id="heroI" placeholder="URL image backdrop">
                <input class="field" id="heroL" placeholder="URL logo (optionnel)">
                <textarea class="field" id="heroD" rows="2" placeholder="Description"></textarea>
                <div class="form-actions">
                    <button class="btn-ghost" onclick="document.getElementById('editHeroModal').remove()">Fermer</button>
                    <button class="btn-primary" onclick="app.submitAddHero()">Ajouter</button>
                </div>
            </div>
        `;
        document.body.appendChild(m);
        this.renderHeroManager();
    },

    renderHeroManager() {
        const el = $('#heroList');
        if (!el) return;
        el.innerHTML = state.hero.map((h, i) => `
            <div style="display:flex;align-items:center;gap:12px;padding:10px;background:var(--bg-elev-3);border-radius:8px;margin-bottom:8px;">
                <img src="${img(h.backdrop || h.poster, 'w185')}" style="width:60px;height:34px;object-fit:cover;border-radius:4px;">
                <div style="flex:1;font-size:13px;font-weight:700;">${this.esc(h.title)}</div>
                <button class="btn-ghost" style="padding:6px 12px;font-size:11px;" onclick="app.removeHero(${i})">Supprimer</button>
            </div>
        `).join('') || '<div style="padding:20px;text-align:center;color:var(--tx-tertiary);font-size:13px;">Aucun élément</div>';
    },

    async removeHero(i) {
        state.hero.splice(i, 1);
        await this.saveHero();
        this.renderHeroManager();
        this.renderHero();
        this.toast("Élément supprimé", 'success');
    },

    async submitAddHero() {
        const title = $('#heroT').value.trim();
        const image = $('#heroI').value.trim();
        const logo = $('#heroL').value.trim();
        const desc = $('#heroD').value.trim();
        if (!title) { this.toast("Titre requis", 'error'); return; }
        const found = state.catalog.find(i => i.title.toLowerCase() === title.toLowerCase());
        state.hero.unshift({
            title,
            backdrop: img(image || (found ? found.backdrop || found.poster : ''), 'w1280'),
            poster: img(image || (found ? found.poster : ''), 'w780'),
            logo,
            overview: desc || (found ? found.overview : ''),
            rating: found ? found.rating : "8.5",
            year: found ? found.year : "2026",
            tmdb_id_clean: found ? (found.tmdb_id_clean || found.tmdb_id) : "1001"
        });
        await this.saveHero();
        $('#heroT').value = ''; $('#heroI').value = ''; $('#heroL').value = ''; $('#heroD').value = '';
        this.renderHeroManager();
        this.renderHero();
        this.toast("Ajouté au carrousel", 'success');
    }
};

// ---------- BOOT ----------
window.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
