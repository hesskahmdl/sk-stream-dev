<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Stream</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0b0b0e; color: #fff; overflow-x: hidden; }

        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 30px; background: rgba(11, 11, 14, 0.95);
            position: fixed; top: 0; width: 100%; z-index: 1000; backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo { font-size: 22px; font-weight: 900; color: #e50914; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; }

        nav { display: flex; gap: 20px; align-items: center; overflow-x: auto; scrollbar-width: none; }
        nav::-webkit-scrollbar { display: none; }
        .nav-item {
            background: none; border: none; color: #aaa; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; gap: 6px; font-weight: 600; padding-bottom: 3px;
            position: relative; transition: color 0.2s; border-bottom: 2px solid transparent; white-space: nowrap;
        }
        .nav-item svg { width: 16px; height: 16px; fill: currentColor; }
        .nav-item:hover, .nav-item.active { color: #fff; border-bottom-color: #e50914; }

        .right-header { display: flex; align-items: center; gap: 12px; }
        .lang-switch { display: flex; gap: 6px; cursor: pointer; }
        .lang-switch img { width: 22px; height: 15px; border-radius: 2px; opacity: 0.4; transition: 0.2s; border: 1px solid transparent; }
        .lang-switch img.active { opacity: 1; border-color: #fff; }

        .search-box input {
            background: #18181f; border: 1px solid #2a2a35; color: #fff; padding: 6px 12px;
            border-radius: 20px; outline: none; font-size: 13px; width: 160px; transition: width 0.3s;
        }
        .search-box input:focus { width: 220px; border-color: #e50914; }

        .hero-container {
            position: relative; width: 100%; height: 75vh; min-height: 480px;
            background-size: cover; background-position: center; transition: background-image 0.8s ease-in-out;
            display: flex; align-items: center; padding: 0 40px; margin-top: 55px;
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(90deg, #0b0b0e 10%, rgba(11,11,14,0.8) 40%, transparent 100%),
                        linear-gradient(0deg, #0b0b0e 0%, transparent 40%);
        }
        .hero-content { position: relative; z-index: 10; max-width: 550px; }
        .hero-tag { color: #e50914; font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .hero-title { font-size: 38px; font-weight: 900; line-height: 1.1; margin-bottom: 12px; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        .hero-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 15px; color: #ddd; font-weight: bold; }
        .badge { background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px; }
        .badge-rating { background: #ffc107; color: #000; }
        .hero-overview { font-size: 14px; color: #ccc; line-height: 1.5; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 1px 1px 5px rgba(0,0,0,0.8); }

        .btn-watch {
            background: #e50914; color: #fff; border: none; padding: 12px 30px; border-radius: 30px;
            font-size: 15px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-watch:hover { background: #ff0f1a; transform: scale(1.05); }

        .main-content { padding: 15px 30px; position: relative; z-index: 10; margin-top: -30px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin: 25px 0 12px; flex-wrap: wrap; gap: 10px; }
        .section-title { font-size: 18px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .filter-select {
            background: #18181f; border: 1px solid #333; color: #fff; padding: 6px 12px;
            border-radius: 8px; font-size: 13px; font-weight: 600; outline: none; cursor: pointer;
        }

        .carousel-wrapper { position: relative; }
        .carousel { display: flex; gap: 14px; overflow-x: auto; scroll-behavior: smooth; padding: 15px 0; scrollbar-width: none; }
        .carousel::-webkit-scrollbar { display: none; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px; padding: 15px 0; }

        .card { cursor: pointer; transition: transform 0.3s; background: transparent; flex: 0 0 140px; position: relative; }
        .movie-grid .card { flex: none; }
        .card:hover { transform: translateY(-6px) scale(1.02); z-index: 5; }
        .card img { width: 100%; height: 210px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .card-info { padding: 6px 2px; }
        .card-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
        .card-meta { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; }
        .card-rating { color: #ffc107; font-weight: bold; }

        /* BADGE SAGA SUR LA CARTE */
        .saga-badge {
            position: absolute; top: 8px; left: 8px;
            background: rgba(229, 9, 20, 0.9); color: #fff;
            font-size: 9px; font-weight: 900; padding: 2px 6px;
            border-radius: 4px; letter-spacing: 1px; z-index: 2;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        /* NUMÉROTATION GÉANTE TOP 10 NETFLIX STYLE */
        .carousel-top10 { gap: 30px; }
        .card-top10 { flex: 0 0 180px; display: flex; align-items: flex-end; position: relative; margin-left: 20px; }
        .card-top10 img { width: 140px; height: 210px; z-index: 2; position: relative; }
        .top10-number {
            position: absolute; left: -35px; bottom: -10px;
            font-size: 120px; font-weight: 900; line-height: 0.8;
            color: #0b0b0e;
            -webkit-text-stroke: 4px #e50914;
            z-index: 1;
            user-select: none;
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
        }

        .btn-load-more {
            display: block; margin: 20px auto 40px; background: #1f1f2e; border: 1px solid #333;
            color: #fff; padding: 12px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-load-more:hover { background: #e50914; border-color: #e50914; }

        .arrow-btn {
            position: absolute; top: 40%; transform: translateY(-50%); width: 38px; height: 38px;
            background: rgba(11,11,14,0.7); border: 2px solid #e50914; border-radius: 50%; color: #fff;
            font-size: 18px; font-weight: bold; cursor: pointer; z-index: 20;
            display: flex; align-items: center; justify-content: center; transition: 0.2s; opacity: 0;
        }
        .carousel-wrapper:hover .arrow-btn { opacity: 1; }
        .arrow-btn:hover { background: #e50914; }
        .arrow-btn.left { left: -15px; }
        .arrow-btn.right { right: -15px; }

        .overlay { position: fixed; inset: 0; background: #0b0b0e; z-index: 3000; display: none; overflow-y: auto; }
        .modal-container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 20px; position: relative; }
        
        .modal-close { position: absolute; top: 15px; right: 20px; background: transparent; border: 2px solid #555; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 50; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: #e50914; border-color: #e50914; }

        .detail-top { display: flex; gap: 30px; margin-top: 30px; flex-wrap: wrap; }
        .detail-poster { width: 220px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); flex-shrink: 0; }
        .detail-info { flex: 1; min-width: 280px; }
        .detail-title { font-size: 32px; font-weight: 900; margin-bottom: 10px; }
        .detail-synopsis { font-size: 14px; color: #bbb; line-height: 1.5; margin: 15px 0; }
        
        .cast-list { display: flex; gap: 12px; margin-top: 15px; overflow-x: auto; padding-bottom: 5px; }
        .cast-item { display: flex; flex-direction: column; align-items: center; text-align: center; width: 70px; flex-shrink: 0; }
        .cast-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #333; margin-bottom: 5px; }
        .cast-name { font-size: 10px; font-weight: bold; line-height: 1.1; }
        
        .trailer-box { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
        .trailer-box h3 { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .trailer-embed { width: 100%; aspect-ratio: 16/9; background: #15151a; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
        .trailer-embed iframe { width: 100%; height: 100%; border: none; }

        .source-buttons { display: flex; gap: 10px; margin-top: 25px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn-source { background: #222; border: 1px solid #444; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .btn-source:hover { background: #333; }
        .btn-source.active { background: #e50914; border-color: #e50914; }

        .player-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; position: relative; margin-bottom: 40px; }
        .player-wrapper iframe { width: 100%; height: 100%; border: none; position: absolute; inset: 0; }

        @media (max-width: 768px) {
            header { padding: 10px 15px; }
            .logo { font-size: 18px; }
            nav { gap: 12px; }
            .nav-item { font-size: 13px; }
            .search-box input { width: 110px; padding: 5px 10px; font-size: 12px; }
            .search-box input:focus { width: 140px; }
            .hero-container { height: 60vh; padding: 0 20px; margin-top: 50px; }
            .hero-title { font-size: 28px; }
            .hero-overview { -webkit-line-clamp: 2; font-size: 12px; }
            .main-content { padding: 10px 15px; }
            .card { flex: 0 0 110px; }
            .card img { height: 160px; }
            .card-top10 { flex: 0 0 140px; margin-left: 15px; }
            .card-top10 img { width: 110px; height: 160px; }
            .top10-number { font-size: 80px; left: -25px; }
            .arrow-btn { display: none; }
            .modal-container { padding: 10px; }
            .detail-top { gap: 15px; margin-top: 20px; }
            .detail-poster { width: 120px; }
            .detail-title { font-size: 22px; }
            .detail-synopsis { font-size: 12px; }
            .trailer-box { width: 100%; }
            .source-buttons { gap: 8px; }
            .btn-source { padding: 10px 14px; font-size: 12px; flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="switchTab('all')">SK STREAM</div>
        <nav>
            <button class="nav-item active" id="btn-all" onclick="switchTab('all')">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> <span class="t-home">Accueil</span>
            </button>
            <button class="nav-item" id="btn-saga" onclick="switchTab('saga')">
                <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> <span>Sagas</span>
            </button>
            <button class="nav-item" id="btn-movie" onclick="switchTab('movie')">
                <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg> <span class="t-movies">Films</span>
            </button>
            <button class="nav-item" id="btn-tv" onclick="switchTab('tv')">
                <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg> <span class="t-series">Séries</span>
            </button>
            <button class="nav-item" id="btn-anime" onclick="switchTab('anime')">
                <svg viewBox="0 0 24 24"><path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61z"/></svg> Anime
            </button>
        </nav>
        
        <div class="right-header">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Rechercher..." class="t-search">
            </div>
            <div class="lang-switch">
                <img src="https://flagcdn.com/w20/fr.png" alt="FR" id="flag-fr" class="active" onclick="setLang('fr')">
                <img src="https://flagcdn.com/w20/gb.png" alt="EN" id="flag-en" onclick="setLang('en')">
            </div>
        </div>
    </header>

    <div class="hero-container" id="heroBanner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-tag">🔥 <span class="t-trend">TENDANCE ACTUELLE</span></div>
            <h1 class="hero-title" id="heroTitle">---</h1>
            <div class="hero-meta">
                <span class="badge" id="heroType">FILM</span>
                <span id="heroYear">2026</span>
                <span class="badge badge-rating" id="heroRating">⭐ 8.5</span>
            </div>
            <p class="hero-overview" id="heroOverview">...</p>
            <button class="btn-watch" id="heroWatchBtn">▶ <span class="t-watch">REGARDER</span></button>
        </div>
    </div>

    <div class="main-content">
        <div id="homeSections">
            <!-- TOP 10 TENDANCES AVEC CHIFFRES GEANTS NETFLIX -->
            <div class="section-title">🔥 Top 10 des Tendances</div>
            <div class="carousel-wrapper">
                <button class="arrow-btn left" onclick="scrollCarousel('gridTop10', -500)">❮</button>
                <div class="carousel carousel-top10" id="gridTop10"></div>
                <button class="arrow-btn right" onclick="scrollCarousel('gridTop10', 500)">❯</button>
            </div>

            <!-- SAGAS INCONTOURNABLES -->
            <div class="section-title" style="margin-top: 25px;">👑 Les Sagas Incontournables</div>
            <div class="carousel-wrapper">
                <button class="arrow-btn left" onclick="scrollCarousel('gridSagas', -500)">❮</button>
                <div class="carousel" id="gridSagas"></div>
                <button class="arrow-btn right" onclick="scrollCarousel('gridSagas', 500)">❯</button>
            </div>

            <div class="section-title" style="margin-top: 25px;">🎬 <span class="t-pop-movies">Films Populaires</span></div>
            <div class="carousel-wrapper">
                <button class="arrow-btn left" onclick="scrollCarousel('gridMovies', -500)">❮</button>
                <div class="carousel" id="gridMovies"></div>
                <button class="arrow-btn right" onclick="scrollCarousel('gridMovies', 500)">❯</button>
            </div>

            <div class="section-title">📺 <span class="t-pop-series">Séries Incontournables</span></div>
            <div class="carousel-wrapper">
                <button class="arrow-btn left" onclick="scrollCarousel('gridSeries', -500)">❮</button>
                <div class="carousel" id="gridSeries"></div>
                <button class="arrow-btn right" onclick="scrollCarousel('gridSeries', 500)">❯</button>
            </div>

            <div class="section-title">✨ <span class="t-pop-anime">Animés & Mangas</span></div>
            <div class="carousel-wrapper">
                <button class="arrow-btn left" onclick="scrollCarousel('gridAnimes', -500)">❮</button>
                <div class="carousel" id="gridAnimes"></div>
                <button class="arrow-btn right" onclick="scrollCarousel('gridAnimes', 500)">❯</button>
            </div>
        </div>

        <div id="filteredSection" style="display:none;">
            <div class="section-header">
                <div class="section-title" id="filterTitle">Résultats</div>
                <select class="filter-select" id="sortSelect" onchange="applySorting()">
                    <option value="rating-desc">⭐ Les mieux notés</option>
                    <option value="rating-asc">⭐ Les moins bien notés</option>
                    <option value="title-asc">🔤 Alphabétique (A-Z)</option>
                    <option value="title-desc">🔤 Alphabétique (Z-A)</option>
                    <option value="year-desc">📅 Plus récents</option>
                </select>
            </div>
            <div class="movie-grid" id="gridFiltered"></div>
            <button class="btn-load-more" id="btnLoadMore" style="display:none;" onclick="loadMoreItems()">Charger la suite</button>
        </div>
    </div>

    <div class="overlay" id="playerModal">
        <div class="modal-container">
            <button class="modal-close" onclick="closePlayer()">✕</button>
            
            <div class="detail-top">
                <img id="modalPoster" src="" class="detail-poster" alt="Affiche">
                
                <div class="detail-info">
                    <h1 class="detail-title" id="modalTitle">Titre</h1>
                    <div class="hero-meta">
                        <span class="badge badge-rating" id="modalRating">⭐ 0.0</span>
                        <span id="modalYear">2026</span>
                        <span class="badge" id="modalType">TYPE</span>
                    </div>
                    <p class="detail-synopsis" id="modalOverview">Synopsis...</p>
                    <div class="cast-list" id="castList"></div>
                </div>

                <div class="trailer-box">
                    <h3>🎬 Bande-annonce</h3>
                    <div class="trailer-embed" id="trailerContainer"></div>
                </div>
            </div>

            <div class="source-buttons">
                <button class="btn-source active" id="btn-vf" onclick="loadSource('vf')">▶ VF (Frembed)</button>
                <button class="btn-source" id="btn-vostfr" onclick="loadSource('vostfr')">▶ VOSTFR (2embed)</button>
            </div>

            <div class="player-wrapper" id="videoContainer"></div>
        </div>
    </div>

    <script>
        const API_KEY = "89dc647004be44c785266ccd4d69576a";
        let catalog = [], heroItems = [], heroIndex = 0, sliderTimer = null, currentItem = null;
        let lang = "fr", searchTimeout = null;
        
        let currentFilteredList = [], currentPage = 1, currentCategoryType = 'all';
        const ITEMS_PER_PAGE = 60;

        const animeKeywords = ["anime", "manga", "japon", "animation", "shonen", "dragon ball", "naruto", "one piece", "demon slayer", "attack on titan"];
        const sagaKeywords = ["spider-man", "spiderman", "avengers", "harry potter", "star wars", "fast & furious", "fast and furious", "matrix", "alien", "thor", "captain america", "batman", "lord of the rings", "seigneur des anneaux", "pirates des caraibes", "pirates of the caribbean", "jurassic", "transformers", "twilight", "hunger games", "john wick"];

        function isAnimeItem(i) {
            if (i.type === 'anime') return true;
            const text = ((i.title || '') + ' ' + (i.overview || '')).toLowerCase();
            return animeKeywords.some(kw => text.includes(kw));
        }

        function isSagaItem(i) {
            if (i.is_saga || i.type === 'saga') return true;
            const text = ((i.title || '') + ' ' + (i.overview || '')).toLowerCase();
            return sagaKeywords.some(kw => text.includes(kw));
        }

        function slugify(text) {
            return (text || '')
                .toString()
                .toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9 -]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-');
        }

        async function init() {
            try {
                const res = await fetch('data.json');
                catalog = await res.json();
                
                heroItems = catalog.slice(0, 10);
                for(let item of heroItems) {
                    const type = (isAnimeItem(item) || item.type === 'tv') ? 'tv' : 'movie';
                    const id = item.tmdb_id_clean || item.tmdb_id;
                    fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`)
                        .then(r => r.json())
                        .then(d => { if(d.backdrop_path) item.backdrop = `https://image.tmdb.org/t/p/original${d.backdrop_path}`; });
                }

                setTimeout(() => { setupHeroSlider(); }, 800);
                renderSections();

                handleInitialUrl();
            } catch (e) { console.error("Erreur:", e); }
        }

        function handleInitialUrl() {
            const hash = window.location.hash.replace('#', '');
            if (!hash) return;

            if (['all', 'saga', 'movie', 'tv', 'anime'].includes(hash)) {
                switchTab(hash, false);
            } else if (hash.startsWith('watch-')) {
                const parts = hash.split('-');
                const tmdbId = parts[parts.length - 1];
                const foundItem = catalog.find(i => String(i.tmdb_id_clean || i.tmdb_id) === String(tmdbId));
                if (foundItem) {
                    openDetails(foundItem, false);
                }
            }
        }

        function setupHeroSlider() {
            if (!heroItems.length) return;
            showHero(0);
            clearInterval(sliderTimer);
            sliderTimer = setInterval(nextHero, 7000);
        }

        function showHero(index) {
            heroIndex = index;
            const item = heroItems[heroIndex];
            const bgUrl = item.backdrop || item.poster;
            document.getElementById('heroBanner').style.backgroundImage = `url('${bgUrl}')`;
            document.getElementById('heroTitle').textContent = item.title;
            document.getElementById('heroType').textContent = isSagaItem(item) ? 'SAGA' : (isAnimeItem(item) ? 'ANIME' : (item.type === 'tv' ? 'SÉRIE' : 'FILM'));
            document.getElementById('heroYear').textContent = item.year || '';
            document.getElementById('heroRating').textContent = `⭐ ${parseFloat(item.rating || 0).toFixed(1)}`;
            document.getElementById('heroOverview').textContent = item.overview || "";
            document.getElementById('heroWatchBtn').onclick = () => openDetails(item);
        }

        function nextHero() { heroIndex = (heroIndex + 1) % heroItems.length; showHero(heroIndex); }

        function createCardHtml(item, showSagaBadge = false) {
            const hasSaga = showSagaBadge || isSagaItem(item);
            return `
                <div class="card" onclick='openDetails(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                    ${hasSaga ? '<div class="saga-badge">SAGA</div>' : ''}
                    <img src="${item.poster || 'https://via.placeholder.com/140x210'}" alt="${item.title}" loading="lazy">
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-meta">
                            <span>${item.year || 'N/A'}</span>
                            <span class="card-rating">⭐ ${parseFloat(item.rating || 0).toFixed(1)}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function createTop10CardHtml(item, rank) {
            return `
                <div class="card-top10" onclick='openDetails(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                    <div class="top10-number">${rank}</div>
                    <img src="${item.poster || 'https://via.placeholder.com/140x210'}" alt="${item.title}" loading="lazy">
                </div>
            `;
        }

        function renderSections() {
            const top10 = [...catalog].sort((a, b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0)).slice(0, 10);
            const sagas = catalog.filter(i => isSagaItem(i));
            const popMovies = [...catalog.filter(i => (i.type === 'movie' || !i.type) && !isAnimeItem(i))].sort((a, b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0));
            const popSeries = [...catalog.filter(i => i.type === 'tv' && !isAnimeItem(i))].sort((a, b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0));
            const popAnimes = [...catalog.filter(i => isAnimeItem(i))].sort((a, b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0));

            document.getElementById('gridTop10').innerHTML = top10.map((item, idx) => createTop10CardHtml(item, idx + 1)).join('');
            document.getElementById('gridSagas').innerHTML = (sagas.length ? sagas : catalog.slice(0, 15)).slice(0, 20).map(i => createCardHtml(i, true)).join('');
            document.getElementById('gridMovies').innerHTML = popMovies.slice(0, 30).map(i => createCardHtml(i)).join('');
            document.getElementById('gridSeries').innerHTML = popSeries.slice(0, 30).map(i => createCardHtml(i)).join('');
            document.getElementById('gridAnimes').innerHTML = (popAnimes.length ? popAnimes : catalog.slice(0, 30)).slice(0, 30).map(i => createCardHtml(i)).join('');
        }

        function scrollCarousel(id, amount) {
            document.getElementById(id).scrollBy({ left: amount, behavior: 'smooth' });
        }

        function switchTab(type, updateUrl = true) {
            currentCategoryType = type;
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${type}`).classList.add('active');
            document.getElementById('searchInput').value = '';

            if (updateUrl) {
                history.pushState(null, null, `#${type === 'all' ? 'home' : type}`);
            }

            if (typeof window.sendPingFunc === 'function') {
                window.sendPingFunc('IDLE', `Onglet: ${type.toUpperCase()}`);
            }

            if (type === 'all') {
                document.getElementById('heroBanner').style.display = 'flex';
                document.getElementById('homeSections').style.display = 'block';
                document.getElementById('filteredSection').style.display = 'none';
            } else {
                document.getElementById('heroBanner').style.display = 'none';
                document.getElementById('homeSections').style.display = 'none';
                document.getElementById('filteredSection').style.display = 'block';

                if (type === 'saga') {
                    currentFilteredList = catalog.filter(i => isSagaItem(i));
                } else if (type === 'movie') { 
                    currentFilteredList = catalog.filter(i => (i.type === 'movie' || !i.type) && !isAnimeItem(i)); 
                } else if (type === 'tv') { 
                    currentFilteredList = catalog.filter(i => i.type === 'tv' && !isAnimeItem(i)); 
                } else if (type === 'anime') { 
                    currentFilteredList = catalog.filter(i => isAnimeItem(i)); 
                }

                applySorting();
            }
        }

        function applySorting() {
            const sortVal = document.getElementById('sortSelect').value;

            if (sortVal === 'rating-desc') {
                currentFilteredList.sort((a, b) => parseFloat(b.rating || 0) - parseFloat(a.rating || 0));
            } else if (sortVal === 'rating-asc') {
                currentFilteredList.sort((a, b) => parseFloat(a.rating || 0) - parseFloat(b.rating || 0));
            } else if (sortVal === 'title-asc') {
                currentFilteredList.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
            } else if (sortVal === 'title-desc') {
                currentFilteredList.sort((a, b) => (b.title || '').localeCompare(a.title || ''));
            } else if (sortVal === 'year-desc') {
                currentFilteredList.sort((a, b) => parseInt(b.year || 0) - parseInt(a.year || 0));
            }

            currentPage = 1;
            renderPaginatedGrid();
        }

        function renderPaginatedGrid() {
            let catTitle = "";
            if (currentCategoryType === 'saga') catTitle = lang === 'fr' ? "👑 Les Sagas Incontournables" : "👑 Iconic Sagas";
            else if (currentCategoryType === 'movie') catTitle = lang === 'fr' ? "🎬 Tous les Films" : "🎬 All Movies";
            else if (currentCategoryType === 'tv') catTitle = lang === 'fr' ? "📺 Toutes les Séries" : "📺 All TV Shows";
            else if (currentCategoryType === 'anime') catTitle = lang === 'fr' ? "✨ Tous les Animés" : "✨ All Anime";
            else catTitle = "🔍 Recherche";

            document.getElementById('filterTitle').textContent = `${catTitle} (${currentFilteredList.length.toLocaleString('fr-FR')})`;

            const itemsToDisplay = currentFilteredList.slice(0, currentPage * ITEMS_PER_PAGE);
            document.getElementById('gridFiltered').innerHTML = itemsToDisplay.length 
                ? itemsToDisplay.map(i => createCardHtml(i, currentCategoryType === 'saga')).join('') 
                : '<p style="color:#aaa; padding:20px;">Aucun contenu trouvé.</p>';

            const btnLoad = document.getElementById('btnLoadMore');
            if (itemsToDisplay.length < currentFilteredList.length) {
                btnLoad.style.display = 'block';
            } else {
                btnLoad.style.display = 'none';
            }
        }

        function loadMoreItems() {
            currentPage++;
            renderPaginatedGrid();
        }

        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const query = this.value.toLowerCase().trim();

            if (!query) { switchTab('all'); return; }

            searchTimeout = setTimeout(() => {
                document.getElementById('heroBanner').style.display = 'none';
                document.getElementById('homeSections').style.display = 'none';
                document.getElementById('filteredSection').style.display = 'block';

                currentCategoryType = 'search';
                currentFilteredList = catalog.filter(item => item.title && item.title.toLowerCase().includes(query));
                
                if (typeof window.sendPingFunc === 'function') {
                    window.sendPingFunc('IDLE', `Recherche: ${query}`);
                }

                applySorting();
            }, 300);
        });

        async function openDetails(item, updateUrl = true) {
            currentItem = item;
            const idClean = item.tmdb_id_clean || item.tmdb_id;
            
            if (updateUrl) {
                const slugTitle = slugify(item.title);
                history.pushState(null, null, `#watch-${slugTitle}-${idClean}`);
            }

            if (typeof window.sendPingFunc === 'function') {
                window.sendPingFunc('WATCHING', item.title);
            }
            
            document.getElementById('modalTitle').textContent = item.title;
            document.getElementById('modalPoster').src = item.poster;
            document.getElementById('modalYear').textContent = item.year;
            document.getElementById('modalRating').textContent = `⭐ ${parseFloat(item.rating || 0).toFixed(1)}`;
            document.getElementById('modalType').textContent = isSagaItem(item) ? 'SAGA' : (isAnimeItem(item) ? 'ANIME' : ((item.type === 'tv') ? 'SÉRIE' : 'FILM'));
            document.getElementById('modalOverview').textContent = item.overview || "Synopsis indisponible.";
            
            document.getElementById('castList').innerHTML = `<span style="color:#666">Chargement...</span>`;
            document.getElementById('trailerContainer').innerHTML = `<span style="padding: 20px; display: block; text-align: center; color: #666;">Recherche...</span>`;

            loadSource('vf');

            document.getElementById('playerModal').style.display = 'block';
            document.body.style.overflow = 'hidden';

            const type = (isAnimeItem(item) || item.type === 'tv') ? 'tv' : 'movie';
            
            try {
                const res = await fetch(`https://api.themoviedb.org/3/${type}/${idClean}?api_key=${API_KEY}&append_to_response=credits,videos&language=${lang === 'fr' ? 'fr-FR' : 'en-US'}`);
                const data = await res.json();
                
                if(data.credits && data.credits.cast) {
                    const topCast = data.credits.cast.slice(0, 5);
                    document.getElementById('castList').innerHTML = topCast.map(actor => `
                        <div class="cast-item">
                            <img class="cast-img" src="${actor.profile_path ? 'https://image.tmdb.org/t/p/w92'+actor.profile_path : 'https://via.placeholder.com/50'}" alt="${actor.name}">
                            <div class="cast-name">${actor.name}</div>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('castList').innerHTML = "";
                }

                let trailer = null;
                if(data.videos && data.videos.results) {
                    trailer = data.videos.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
                }
                if(trailer) {
                    document.getElementById('trailerContainer').innerHTML = `<iframe src="https://www.youtube.com/embed/${trailer.key}?mute=1" allowfullscreen></iframe>`;
                } else {
                    document.getElementById('trailerContainer').innerHTML = `<span style="padding: 20px; display: block; text-align: center; color: #666;">Aucune bande-annonce</span>`;
                }
            } catch (e) { 
                document.getElementById('castList').innerHTML = "";
                document.getElementById('trailerContainer').innerHTML = "";
            }
        }

        function loadSource(sourceType) {
            if (!currentItem) return;
            const id = currentItem.tmdb_id_clean || currentItem.tmdb_id;
            const isTv = (isAnimeItem(currentItem) || currentItem.type === 'tv');
            let url = "";

            document.querySelectorAll('.btn-source').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${sourceType}`).classList.add('active');

            if (sourceType === 'vf') {
                url = isTv ? `https://frembed.casa/api/serie.php?id=${id}&sa=1&epi=1` : `https://frembed.casa/api/film.php?id=${id}`;
            } else if (sourceType === 'vostfr') {
                url = isTv ? `https://www.2embed.cc/embedtv/${id}&s=1&e=1` : `https://www.2embed.cc/embed/${id}`;
            }

            document.getElementById('videoContainer').innerHTML = `<iframe src="${url}" allowfullscreen></iframe>`;

            if (typeof window.sendPingFunc === 'function') {
                window.sendPingFunc('WATCHING', currentItem.title);
            }
        }

        function closePlayer() {
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('videoContainer').innerHTML = '';
            document.getElementById('trailerContainer').innerHTML = '';
            document.body.style.overflow = 'auto';

            const activeTab = document.querySelector('.nav-item.active').id.replace('btn-', '');
            history.pushState(null, null, `#${activeTab === 'all' ? 'home' : activeTab}`);

            if (typeof window.sendPingFunc === 'function') {
                window.sendPingFunc('IDLE', `Accueil: ${activeTab.toUpperCase()}`);
            }
        }

        function setLang(l) {
            lang = l;
            document.getElementById('flag-fr').classList.toggle('active', l === 'fr');
            document.getElementById('flag-en').classList.toggle('active', l === 'en');
            
            document.querySelector('.t-home').textContent = l === 'fr' ? 'Accueil' : 'Home';
            document.querySelector('.t-movies').textContent = l === 'fr' ? 'Films' : 'Movies';
            document.querySelector('.t-series').textContent = l === 'fr' ? 'Séries' : 'TV Shows';
            document.querySelector('.t-search').placeholder = l === 'fr' ? 'Rechercher...' : 'Search...';
            document.querySelector('.t-trend').textContent = l === 'fr' ? 'TENDANCE ACTUELLE' : 'TRENDING NOW';
            document.querySelector('.t-watch').textContent = l === 'fr' ? 'REGARDER' : 'WATCH';
            document.querySelector('.t-pop-movies').textContent = l === 'fr' ? 'Films Populaires' : 'Popular Movies';
            document.querySelector('.t-pop-series').textContent = l === 'fr' ? 'Séries Incontournables' : 'Top TV Shows';
            document.querySelector('.t-pop-anime').textContent = l === 'fr' ? 'Animés & Mangas' : 'Anime';
        }

        window.addEventListener('popstate', handleInitialUrl);

        init();
    </script>

    <!-- TRACKER OPTIMISÉ FIREBASE -->
    <script>
        (function() {
            if (window.location.href.includes('sk-admin-secret.html')) return;

            const FIREBASE_DB_URL = "https://sk-stream-default-rtdb.europe-west1.firebasedatabase.app";
            
            let userId = localStorage.getItem('sk_user_id');
            if (!userId) {
                const randomNum = Math.floor(1000 + Math.random() * 9000);
                userId = `Utilisateur #${randomNum}`;
                localStorage.setItem('sk_user_id', userId);
            }

            const width = window.innerWidth;
            const ua = navigator.userAgent;
            let deviceType = "💻 PC Windows";

            if (/iPhone/i.test(ua)) deviceType = "📱 iPhone";
            else if (/iPad/i.test(ua)) deviceType = "📱 iPad";
            else if (/Android/i.test(ua)) deviceType = width < 768 ? "📱 Android Mobile" : "📱 Tablette Android";
            else if (/Macintosh/i.test(ua)) deviceType = "💻 Mac";

            let geoInfo = localStorage.getItem('sk_geo_info') || "France";
            let userIp = localStorage.getItem('sk_real_ip') || "82.120.XX.XX";

            async function fetchGeoLocation() {
                try {
                    const r1 = await fetch('https://api.ipify.org?format=json');
                    const d1 = await r1.json();
                    if (d1 && d1.ip) {
                        userIp = d1.ip;
                        localStorage.setItem('sk_real_ip', userIp);
                        
                        const r2 = await fetch(`https://api.bigdatacloud.net/data/client-ip`);
                        const d2 = await r2.json();
                        if (d2 && d2.countryName) {
                            geoInfo = `${d2.countryName} - ${d2.city || 'Ville'}`;
                            localStorage.setItem('sk_geo_info', geoInfo);
                        }
                    }
                } catch(e) {
                    try {
                        const r3 = await fetch('https://ipapi.co/json/');
                        const d3 = await r3.json();
                        if (d3 && d3.ip) {
                            userIp = d3.ip;
                            geoInfo = `${d3.country_name || 'France'} - ${d3.city || 'Inconnu'}`;
                            localStorage.setItem('sk_real_ip', userIp);
                            localStorage.setItem('sk_geo_info', geoInfo);
                        }
                    } catch(e2) {}
                }
            }
            fetchGeoLocation();

            window.sendPingFunc = function(status = 'IDLE', customTitle = '') {
                const now = Date.now();
                const currentHash = window.location.hash || '#home';

                let pageTitle = customTitle;
                if (!pageTitle) {
                    if (typeof currentItem !== 'undefined' && currentItem && currentItem.title) {
                        pageTitle = currentItem.title;
                    } else if (currentHash.startsWith('#watch-')) {
                        const cleanSlug = currentHash.replace('#watch-', '').replace(/-\d+$/, '').replace(/-/g, ' ');
                        pageTitle = cleanSlug.charAt(0).toUpperCase() + cleanSlug.slice(1);
                    } else if (currentHash === '#saga') pageTitle = "Section Sagas";
                    else if (currentHash === '#movie') pageTitle = "Section Films";
                    else if (currentHash === '#tv') pageTitle = "Section Séries";
                    else if (currentHash === '#anime') pageTitle = "Section Animés";
                    else pageTitle = "Page d'Accueil";
                }

                const safeKey = userId.replace('#', 'ID_');

                const payload = {
                    uid: userId,
                    ip: userIp,
                    geo: geoInfo,
                    device: deviceType,
                    status: status,
                    title: pageTitle,
                    lastPing: now
                };

                try {
                    fetch(`${FIREBASE_DB_URL}/requests/${now}_${safeKey}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    fetch(`${FIREBASE_DB_URL}/ip_stats/${safeKey}.json`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            uid: userId,
                            ip: userIp, 
                            geo: geoInfo,
                            device: deviceType,
                            lastVisit: now, 
                            lastPage: pageTitle 
                        })
                    });
                } catch (e) {}
            };

            window.sendPingFunc('IDLE');

            setInterval(() => {
                const isPlaying = document.getElementById('playerModal') && document.getElementById('playerModal').style.display === 'block';
                const activeTitle = (typeof currentItem !== 'undefined' && currentItem && currentItem.title) ? currentItem.title : '';
                window.sendPingFunc(isPlaying ? 'WATCHING' : 'IDLE', activeTitle);
            }, 5000);
        })();
    </script>
